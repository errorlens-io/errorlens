[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "errorlens"
dynamic = ["version"]
description = "Python SDK for ErrorLens, the open-source, self-hosted error tracker."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "ErrorLens contributors" }]
keywords = ["error tracking", "exceptions", "monitoring", "self-hosted", "errorlens"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Bug Tracking",
]
# The transport/instrumentation layer is the MIT-licensed open-source error SDK.
dependencies = ["sentry-sdk>=2.0,<4"]

[project.urls]
Homepage = "https://errorlens.io"
Source = "https://github.com/errorlenshq/errorlens"

[tool.hatch.version]
path = "src/errorlens/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/errorlens"]
