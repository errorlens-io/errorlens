name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build web UI
        run: cd web && npm ci && npm run build
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          ERRORLENS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -race -count=1 ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -o bin/errorlens ./cmd/errorlens

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: errorlensio/errorlens:ci

  sdk-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        core: ["sentry-sdk>=2,<3", "sentry-sdk>=3,<4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        working-directory: sdks/python
        run: |
          pip install "${{ matrix.core }}" -e .
          python -m unittest discover -s tests -v

  sdk-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test
        working-directory: sdks/javascript
        run: npm ci && npm test
