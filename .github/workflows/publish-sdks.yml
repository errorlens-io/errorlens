# Publishes the SDKs when a version tag (v1.2.3) is pushed:
#   PyPI: errorlens            (trusted publishing — no stored token)
#   npm:  @errorlens/node, @errorlens/browser (trusted publishing, with provenance)
# Both registries must list this repository and workflow as a trusted publisher.
# Versions come from sdks/python/src/errorlens/_version.py and each package.json,
# and must match the tag.
name: publish-sdks

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Which registry to publish to
        type: choice
        options: [all, pypi, npm]
        default: all

permissions:
  contents: read

jobs:
  pypi:
    if: github.event_name == 'push' || inputs.target != 'npm'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python -c "import re;print(re.search(r'\"(.+)\"', open('sdks/python/src/errorlens/_version.py').read()).group(1))")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "version $v does not match tag ${GITHUB_REF_NAME}"; exit 1; }
      - name: Test and build
        working-directory: sdks/python
        run: |
          pip install build -e .
          python -m unittest discover -s tests
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist

  npm:
    if: github.event_name == 'push' || inputs.target != 'pypi'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Test and build
        working-directory: sdks/javascript
        run: npm ci && npm test
      - name: Publish
        working-directory: sdks/javascript
        run: |
          npm install -g npm@latest
          for p in node browser; do
            (cd packages/$p && npm publish --provenance --access public)
          done
