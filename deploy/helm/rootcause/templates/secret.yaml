{{- if or (not .Values.database.existingSecret) (and .Values.encryption.key (not .Values.encryption.existingSecret)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rootcause.fullname" . }}-secrets
  labels: {{- include "rootcause.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.database.existingSecret }}
  DATABASE_URL: {{ required "database.url or database.existingSecret is required" .Values.database.url | quote }}
  {{- end }}
  {{- if and .Values.encryption.key (not .Values.encryption.existingSecret) }}
  ENCRYPTION_KEY: {{ .Values.encryption.key | quote }}
  {{- end }}
{{- end }}
