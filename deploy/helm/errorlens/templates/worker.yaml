apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "errorlens.fullname" . }}-worker
  labels: {{- include "errorlens.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {{- include "errorlens.labels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels: {{- include "errorlens.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: errorlens
          image: {{ include "errorlens.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--no-migrate", "--role=worker"]
          env: {{- include "errorlens.env" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
