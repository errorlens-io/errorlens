apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "errorlens.fullname" . }}-web
  labels: {{- include "errorlens.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {{- include "errorlens.labels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels: {{- include "errorlens.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: errorlens
          image: {{ include "errorlens.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--no-migrate", "--role=web"]
          env: {{- include "errorlens.env" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "errorlens.fullname" . }}
  labels: {{- include "errorlens.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "errorlens.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
