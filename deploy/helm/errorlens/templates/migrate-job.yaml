# Applies database migrations before web/worker pods roll out.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "errorlens.fullname" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "errorlens.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true }
      containers:
        - name: migrate
          image: {{ include "errorlens.image" . }}
          args: ["migrate"]
          env: {{- include "errorlens.env" . | nindent 12 }}
