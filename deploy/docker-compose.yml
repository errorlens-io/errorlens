# RootCause + Postgres. Usage:
#   cp deploy/.env.example deploy/.env   # then edit the password
#   docker compose -f deploy/docker-compose.yml up -d
# Open http://localhost:8080 and create the first account.
name: rootcause

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rootcause
      POSTGRES_DB: rootcause
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootcause"]
      interval: 5s
      retries: 10

  rootcause:
    image: rootcausehq/rootcause:${ROOTCAUSE_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ROOTCAUSE_DATABASE_URL: postgres://rootcause:${POSTGRES_PASSWORD}@postgres:5432/rootcause?sslmode=disable
      ROOTCAUSE_PUBLIC_URL: ${ROOTCAUSE_PUBLIC_URL:-http://localhost:8080}
    ports:
      - "${ROOTCAUSE_PORT:-8080}:8080"

volumes:
  pgdata:
